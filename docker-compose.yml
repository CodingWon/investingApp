version: '3.8'

services:
  mariadb:
    image: mariadb:11.2
    container_name: investingapp-mariadb
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MARIADB_ROOT_PASSWORD: rootpassword123
      MARIADB_DATABASE: investingapp
      MARIADB_USER: appuser
      MARIADB_PASSWORD: password123
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - investingapp-network
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: investingapp-phpmyadmin
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      PMA_HOST: mariadb
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: rootpassword123
    depends_on:
      - mariadb
    networks:
      - investingapp-network

volumes:
  mariadb_data:

networks:
  investingapp-network:
    driver: bridge
